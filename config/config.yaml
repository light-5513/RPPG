# ---- Dataset ----
dataset:
  name: "ubfc-rppg"
  kaggle_id: "malekdinarito/ubfc-rppg-dataset"
  raw_path: "datasets/ubfc-rppg"
  processed_path: "datasets/processed"
  frame_rate: 30
  video_ext: ".avi"

# ---- Preprocessing ----
preprocess:
  face_roi_size: 72
  clip_length: 150
  stride: 75
  train_split: 0.8
  normalize: true

# ---- Model ----
model:
  name: "EfficientPhys"
  input_channels: 3
  frame_depth: 150
  img_size: 72

# ---- Training ----
training:
  epochs: 30
  batch_size: 2
  learning_rate: 0.0001
  weight_decay: 0.00001
  scheduler_step: 10
  scheduler_gamma: 0.5
  num_workers: 2
  device: "cpu"
  save_path: "models/saved"
  log_path: "outputs/logs"

# ---- Evaluation ----
evaluation:
  metrics: ["MAE", "RMSE", "Pearson", "SNR"]
  plot_path: "outputs/plots"

# ---- Live Demo ----
live_demo:
  camera_source: "http://192.168.1.100:4747/video"
  buffer_seconds: 10
  frame_rate: 30
  display_width: 640
  display_height: 480
  inference_interval_seconds: 1.0
  min_buffer_seconds: 3